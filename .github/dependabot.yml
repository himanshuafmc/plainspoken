# Weekly dependency updates (GitHub's Dependabot). They arrive on Friday so the Saturday maintenance run
# (docs/MAINTENANCE.md) can check them. Minor and patch updates are grouped; major updates come one by one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: Asia/Kolkata
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: Asia/Kolkata
    groups:
      android-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android/core
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: Asia/Kolkata
    groups:
      android-core-minor-and-patch:
        update-types: [minor, patch]
