name: build

# Builds and tests both apps. A release (Windows zip + Android APK, one version) is published for a pushed
# v* tag, or for a push whose commit message contains [release] (then the tag v<VERSION> is created here).

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  windows-core-tests:
    # Same-repo PRs are already covered by the push run on the same commit.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj', 'windows/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Core tests
        run: dotnet test windows/tests/Plainspoken.Core.Tests -c Release

  windows:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj', 'windows/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore windows/Plainspoken.sln
      - name: Build
        run: dotnet build windows/Plainspoken.sln -c Release --no-restore
      - name: Test
        run: dotnet test windows/tests/Plainspoken.Core.Tests -c Release --no-build
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $built = (dotnet msbuild windows/src/Plainspoken.App/Plainspoken.App.csproj -getProperty:Version).Trim()
          if ($v -ne $built) { throw "VERSION ($v) and the Windows build ($built) disagree" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Publish single-file exe
        run: >
          dotnet publish windows/src/Plainspoken.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o publish
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item windows/src/Plainspoken.App/Assets/READ-ME-FIRST.txt publish/
          Copy-Item LICENSE publish/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.md publish/
          $zip = "Plainspoken-win-x64-${{ steps.ver.outputs.version }}.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem publish, $zip | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Plainspoken-win-x64-${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  android:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Core tests
        run: ./gradlew -p core test --console=plain
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAINSPOKEN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plainspoken-release.jks"
            echo "PLAINSPOKEN_KEYSTORE=$RUNNER_TEMP/plainspoken-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No signing secrets (e.g. a pull request from a fork): the APK is signed with a throwaway test key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and lint the APK
        env:
          PLAINSPOKEN_KEYSTORE_PASSWORD: ${{ secrets.PLAINSPOKEN_KEYSTORE_PASSWORD }}
          PLAINSPOKEN_KEY_ALIAS: ${{ secrets.PLAINSPOKEN_KEY_ALIAS }}
          PLAINSPOKEN_KEY_PASSWORD: ${{ secrets.PLAINSPOKEN_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease --console=plain
      - name: Name the APK
        run: |
          v=$(tr -d '[:space:]' < ../VERSION)
          suffix=$([ "${{ steps.key.outputs.signed }}" = "true" ] && echo "" || echo "-test")
          cp app/build/outputs/apk/release/app-release.apk "../Plainspoken-android-$v$suffix.apk"
          ls -l ../*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: Plainspoken-android-*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: [windows-core-tests, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            CHANGELOG.md
            VERSION
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: windows
      - uses: actions/download-artifact@v8
        with:
          name: android
      - name: Check version, tag and signing
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($VERSION)"; exit 1
          fi
          if [ "${{ needs.android.outputs.signed }}" != "true" ] || [ ! -f "Plainspoken-android-$VERSION.apk" ]; then
            echo "::error::The Android APK isn't signed with the release key. Add the PLAINSPOKEN_KEYSTORE_BASE64, PLAINSPOKEN_KEYSTORE_PASSWORD, PLAINSPOKEN_KEY_ALIAS and PLAINSPOKEN_KEY_PASSWORD secrets (see CONTRIBUTING.md)."
            exit 1
          fi
      - name: Write release notes from CHANGELOG.md
        run: |
          WIN="Plainspoken-win-x64-$VERSION.zip"
          APK="Plainspoken-android-$VERSION.apk"
          # The section under "## [<version>]", up to the next "## [" heading; link lines are skipped.
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > section.md
          if [ ! -s section.md ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION"
          fi
          {
            cat section.md
            echo
            echo "---"
            echo
            echo "### Download"
            echo "- **Windows 10/11:** \`$WIN\` — unzip it and run \`Plainspoken.exe\`. If Windows shows \"Windows protected your PC\", click **More info**, then **Run anyway** (the app isn't code-signed)."
            echo "- **Android 8 or newer:** \`$APK\` — open it on your phone and allow installing apps from your browser or file manager when asked."
            echo
            echo "First steps for both are in the [README](https://github.com/$GITHUB_REPOSITORY#readme)."
            echo
            echo "SHA-256:"
            echo '```'
            sha256sum "$WIN" "$APK"
            echo '```'
          } > notes.md
          cat notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WIN="Plainspoken-win-x64-$VERSION.zip"
          APK="Plainspoken-android-$VERSION.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing the files and notes"
            gh release upload "$TAG" "$WIN" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$WIN" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Plainspoken $TAG" --notes-file notes.md
          fi
