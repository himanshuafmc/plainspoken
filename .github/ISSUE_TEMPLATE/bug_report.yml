name: Bug report
description: Something didn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem!
        **Never paste your Gemini API key or anything private you dictated.** Describe the kind of text instead (for example "a short WhatsApp message in Hinglish").
  - type: dropdown
    id: platform
    attributes:
      label: Which app?
      options:
        - Windows
        - Android
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows or Android version, and device
      description: "Windows: press Win+R, type `winver`. Android: Settings → About phone."
      placeholder: "Windows 11 23H2 / Android 14 on a Pixel 7"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plainspoken version
      description: "Windows: right-click the tray icon → About. Android: the bottom of the Plainspoken app's home screen."
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: What were you speaking?
      options:
        - English
        - Hindi
        - Hinglish (mixed)
        - Not about speech
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      placeholder: "1. Opened WhatsApp  2. Tapped the mic on the Plainspoken keyboard  3. Spoke for 10 seconds  4. Tapped ✓"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log (optional)
      description: |
        Windows: the newest file in `%LOCALAPPDATA%\Plainspoken\logs`. Android: Plainspoken app → Settings → Export the log.
        Logs never contain your words or your key, but please look before pasting.
      render: text
